<!doctype html>
<meta charset="utf-8">
<title>E2E</title>
<body style="white-space:pre;font-family:monospace">
<iframe id="f" src="../index.html?demo" style="width:1200px;height:900px"></iframe>
<script>
// Drives the real page with the simulator: record, snapshot, viewer, backup round-trip.
const log = (m) => (document.body.firstChild.textContent += m + "\n");
document.body.prepend(document.createTextNode(""));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const errors = [];
const until = async (fn, ms = 4000) => { const t = Date.now(); while (!fn() && Date.now() - t < ms) await sleep(50); return fn(); };
const f = document.getElementById("f");
f.onload = async () => {
  const w = f.contentWindow, $ = (s) => w.document.querySelector(s);
  w.addEventListener("error", (e) => errors.push(e.message));
  w.addEventListener("unhandledrejection", (e) => errors.push(String(e.reason)));
  const check = (c, m) => { log((c ? "✔ " : "✘ ") + m); if (!c) errors.push(m); };
  try {
    await sleep(2500);
    check(/\d\.\d{3}/.test($("#value").textContent), "lecturas del simulador: " + $("#value").textContent);
    $("#rec-name").value = "e2e";
    $("#rec-start").click();
    await sleep(2500);
    $("#rec-stop").click();
    await sleep(500);
    const ses = await w.DB.sessions();
    check(ses.length >= 1 && ses[0].name === "e2e" && ses[0].count >= 3 && ses[0].ended, `sesión grabada (${ses[0]?.count} lecturas)`);
    $("#snap-note").value = "nota";
    $("#snap").click();
    check(await until(() => $("#snaps").children.length >= 1), "captura guardada");
    // invert while recording: past live data and already-saved readings flip too
    $("#rec-name").value = "inv";
    $("#rec-start").click();
    await sleep(1500);
    const n0 = w.eval("live.length");
    $("#inv-btn").click();
    await sleep(1500);
    $("#rec-stop").click();
    await sleep(500);
    check($("#value").textContent.startsWith("-") && $("#flags").textContent.includes("INV"), "invertir: " + $("#value").textContent);
    check(w.eval("live.length") >= n0 && w.eval("live.every(r => r.value < 0)"), "invertir conserva y corrige la gráfica");
    const invSes = (await w.DB.sessions()).find((s) => s.name === "inv");
    const invRows = await w.DB.readings(invSes.id);
    check(invRows.length >= 4 && invRows.every((r) => r.value < 0 && r.flags.includes("INV")) && invSes.max < 0,
      `invertir corrige lo ya grabado (${invRows.length} lecturas)`);
    $("#inv-btn").click();
    await sleep(800);
    check(w.eval("live.every(r => r.value > 0 && !r.flags.includes('INV'))"), "volver a invertir restaura los valores");
    w.document.querySelector("#sessions tr[data-id]").click();
    check(await until(() => $("#viewer").open && /Lecturas/.test($("#v-meta").textContent)), "visor de sesión");
    $("#viewer").close();
    const dump = await w.DB.exportAll();
    const before = (await w.DB.sessions()).length;
    await w.DB.importAll(JSON.parse(JSON.stringify(dump)));
    check((await w.DB.sessions()).length === before * 2, "copia de seguridad: exportar + importar");
    const csv = w.eval("toCSV")(await w.DB.readings(ses[0].id));
    check(csv.split("\n").length >= 4 && csv.startsWith("fecha,"), "CSV de sesión");
    // open a spreadsheet CSV: column picker dialog, then a new session in the viewer
    const csvFile = new w.File(["Fecha;Tensión (mV)\n22/10/2026 10:00:00;3,297\n22/10/2026 10:00:01;3,310\n22/10/2026 10:00:02;3,305\n"],
      "bateria.csv", { type: "text/csv" });
    await w.eval("openFile")(csvFile);
    check(await until(() => $("#importer").open && !$("#im-ok").disabled), "diálogo de importación con vista previa");
    $("#im-ok").click();
    check(await until(() => $("#viewer").open && $("#v-name").value === "bateria"), "CSV abierto en el visor");
    const imp = (await w.DB.sessions()).find((x) => x.name === "bateria");
    check(imp && imp.count === 3 && Math.abs(imp.max - 0.00331) < 1e-12, `sesión importada (${imp?.count} lecturas, máx ${imp?.max})`);
    $("#viewer").close();
    // our own export goes straight in, no questions
    const own = new w.File([csv], "propio.csv", { type: "text/csv" });
    await w.eval("openFile")(own);
    check(await until(() => $("#viewer").open && $("#v-name").value === "propio"), "CSV propio abierto directamente");
    $("#viewer").close();
    for (const s of await w.DB.sessions()) await w.DB.deleteSession(s.id);
    await w.DB.clearSnapshots();
  } catch (e) { errors.push(e.stack || String(e)); }
  log(errors.length ? "FALLOS:\n" + errors.join("\n") : "TODO OK");
  document.body.dataset.done = "1";
};
</script>
